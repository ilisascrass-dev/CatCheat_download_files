<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatCheat_TT_files</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0d17;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f7c948, #f5a623);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header .sub {
            color: #9aa8cc;
            font-size: 1rem;
            margin-top: 4px;
        }

        .description {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px 20px;
            text-align: center;
            color: #d0d9f0;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
        }

        .description .highlight {
            color: #f5c890;
            font-weight: 600;
        }

        .tutorial {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
        }

        .tutorial h2 {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 14px;
        }

        .tutorial .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            color: #c8d0e6;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tutorial .step:last-child {
            border-bottom: none;
        }

        .tutorial .step .num {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            background: rgba(245, 166, 35, 0.15);
            border-radius: 50%;
            color: #f5c890;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .tutorial .step strong {
            color: #f5c890;
        }

        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f5a623, #f7c948);
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0b0d17;
            text-decoration: none;
            transition: 0.25s;
            cursor: pointer;
        }

        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(245, 166, 35, 0.3);
        }

        .footer {
            text-align: center;
            color: #3d4a6a;
            font-size: 0.8rem;
            margin-top: 24px;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- 1. Main CatCheat -->
        <div class="header">
            <h1>Main CatCheat</h1>
            <div class="sub">Main CatCheat</div>
        </div>

        <!-- 2. Описание -->
        <div class="description">
            📱 Если вы пришли с <span class="highlight">ТикТока</span>, вы можете скачать файлы тут!
        </div>

        <!-- 3. Туториал -->
        <div class="tutorial">
            <h2>📖 Туториал</h2>
            <div class="step">
                <span class="num">1</span>
                <span>Перейдите по ссылке в <strong>ТикТоке</strong></span>
            </div>
            <div class="step">
                <span class="num">2</span>
                <span>Нажмите <strong>«Скачать»</strong> ниже</span>
            </div>
            <div class="step">
                <span class="num">3</span>
                <span>Установите APK на телефон</span>
            </div>
            <div style="margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.05); color: #7a8aaa; font-size: 0.9rem;">
                ✈️ Удобно скачивать в Telegram:
            </div>
            <a href="https://t.me/CatCheat_System" class="telegram-btn" target="_blank">
                t.me/CatCheat_System
            </a>
        </div>

        <div class="footer">
            Main CatCheat • 2026
        </div>

    </div>
</body>
</html>
